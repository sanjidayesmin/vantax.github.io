<html lang="en">

<meta charset="UTF-8">

<title>SANJIDA // CYBER SYSTEM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020504;
    color:#d7ffe8;
    font-family:"Courier New",monospace;
    overflow-x:hidden;
}

/* MATRIX BACKGROUND */

canvas{
    position:fixed;
    inset:0;
    z-index:-5;
    opacity:.18;
}

/* SCANLINES */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,255,120,.025) 4px
    );
}

/* NAV */

nav{
    position:fixed;
    top:0;
    width:100%;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,5,3,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,255,120,.18);
    z-index:10;
}

.logo{
    color:#00ff73;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 15px #00ff73;
}

nav a{
    color:#8ba596;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#00ff73;
    text-shadow:0 0 12px #00ff73;
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:100px 20px 50px;
}

.interface{
    width:min(1000px,100%);
    border:1px solid rgba(0,255,120,.3);
    background:rgba(0,10,6,.72);
    box-shadow:
        0 0 40px rgba(0,255,120,.08),
        inset 0 0 50px rgba(0,255,120,.025);
    position:relative;
    overflow:hidden;
}

.interface:after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#00ff73;
    box-shadow:0 0 20px #00ff73;
    top:-2px;
    animation:scan 4s linear infinite;
}

@keyframes scan{
    0%{top:-2px}
    100%{top:100%}
}
