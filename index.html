}

.cursor{

.btn:hover{

section{

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    padding:30px;
    border:1px solid rgba(0,255,120,.18);
    background:rgba(10,15,12,.65);
    transition:.4s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:1px;
    background:#00ff78;
    transition:.5s;
}

.card:hover::before{
    left:100%;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#00ff78;
    box-shadow:0 0 30px rgba(0,255,120,.12);
}

.icon{
    font-size:35px;

}

.card h3{

}

.card p{
    color:#8d9b92;
    line-height:1.7;
}

/* Robotics special */
.robotics{

}

.robot{
    font-size:65px;
    display:inline-block;
    animation:robotMove 3s ease-in-out infinite;
}

@keyframes robotMove{
    0%,100%{transform:translateX(0) rotate(0)}
    25%{transform:translateX(8px) rotate(2deg)}
    75%{transform:translateX(-8px) rotate(-2deg)}
}

/* Terminal */
.terminal-box{
    border:1px solid rgba(0,255,120,.25);

    color:#9effbe;

}

/* Footer */
footer{
    text-align:center;
    padding:30px;
    border-top:1px solid rgba(0,255,120,.12);

}

/* Scroll animation */
.reveal{
    opacity:0;
    transform:translateY(30px);
    transition:1s;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:700px){
    nav{
        padding:15px 5%;
    }

    nav div:last-child{
        display:none;
    }

    section{
        padding:80px 5%;
    }

    .terminal{
        padding:35px 20px;
    }
}
</style>
</head>
